version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    stdin_open: true
    volumes:
      - ./src:/usr/src/app/src
#      - ./node_modules:/usr/src/app/node_modules:cached
    container_name: portfolio-dev
    restart: always
    environment:
      - CHOKIDAR_USEPOLLING=true # needed for file watching on some docker hosts
    ports:
      - 5173:5173 # vite default port
    command: npm run start -- --host
